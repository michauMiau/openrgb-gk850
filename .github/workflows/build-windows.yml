name: Build Windows plugin

on:
  workflow_dispatch:
  push:
    branches: [main, experimental]
    paths: ['plugin/**', '.github/workflows/build-windows.yml']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.4.2 (mingw)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          cache: true

      - name: Fetch hidapi
        shell: bash
        run: git clone --depth 1 --branch hidapi-0.13.1 https://github.com/libusb/hidapi.git "$GITHUB_WORKSPACE/hidapi"

      - name: Fetch OpenRGB headers
        shell: bash
        run: |
          git clone --depth 1 https://gitlab.com/CalcProgrammer1/OpenRGB.git "$GITHUB_WORKSPACE/OpenRGB" || \
          git clone --depth 1 https://github.com/CalcProgrammer1/OpenRGB.git "$GITHUB_WORKSPACE/OpenRGB"

      - name: Build DLL
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\6.4.2\mingw_64\bin;C:\Qt\Tools\mingw900_64\bin;$env:PATH"
          cd plugin
          qmake OpenGK850WPlugin-win.pro "OPENRGB_ROOT=$env:GITHUB_WORKSPACE/OpenRGB" "HIDAPI_ROOT=$env:GITHUB_WORKSPACE/hidapi"
          mingw32-make -j4

      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item plugin/*.dll pkg/ -ErrorAction SilentlyContinue
          Copy-Item *.dll pkg/ -ErrorAction SilentlyContinue
          Copy-Item C:\Qt\6.4.2\mingw_64\bin\Qt6Core.dll, C:\Qt\6.4.2\mingw_64\bin\Qt6Widgets.dll, C:\Qt\6.4.2\mingw_64\bin\Qt6Gui.dll pkg/
          Copy-Item C:\Qt\Tools\mingw900_64\bin\libgcc_s_seh-1.dll, C:\Qt\Tools\mingw900_64\bin\libstdc++-6.dll, C:\Qt\Tools\mingw900_64\bin\libwinpthread-1.dll pkg/

      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path pkg/* -DestinationPath OpenGK850WPlugin-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGK850WPlugin-win64
          path: OpenGK850WPlugin-win64.zip
